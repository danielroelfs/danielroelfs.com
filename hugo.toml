baseURL = "/"
title = "Daniel Roelfs"
theme = "alta"

ignoreFiles = ["\\.qmd$", "\\.ipynb$", "\\.Rmd$", "\\.Rmarkdown$",
    "_cache$", "index\\.html", "about\\.html", "static/blog/\\*_files/", "README.md",
    ".venv/", "data/", "/renv/"]

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
    intro = "My name is <span class='accent-color'>Daniel Roelfs</span>, Data Scientist at the Analytics & AI Centre of Excellence in Storebrand, previously working within academia and anti-money laundering at DNB"

    favicon = "avatar.png"

    highlightstyle = "routeros"

    home_name = "Home"
    show_breadcrumbs = true

    description = "Daniel Roelfs' personal website"
    keywords    = "blog, personal, coding"

    customcss   = ["custom_style.scss"]

    iconsource  = "tabler"

    umami       = true
    umamilink   = "https://web-analytics.danielroelfs.app/script.js"
    umamiid     = "10185115-89df-427f-9aea-8c3575857825"
    
